; hands.ini — configuration de la couche XR_APILAYER_HANDS_bare
; Ce fichier est relu automatiquement (environ 1 seconde apres chaque enregistrement).
; Exception : la section [general] process_allowlist / discovery_mode n'est lue
; qu'au demarrage du jeu.
; Commentaires : lignes commencant par ; ou #

[general]
; Interrupteur general (bascule depuis l'icone de la barre des taches). false = la couche
; laisse tout passer ; effectif au prochain lancement du jeu.
enabled = true

; Executables pour lesquels la couche s'active. ATTENTION : valeur NON VERIFIEE.
; Verifiez le nom exact avec scripts\check-process.ps1 pendant que MSFS tourne.
process_allowlist = FlightSimulator2024.exe

; true  = la couche s'active (journalisation seule) pour TOUT programme OpenXR :
;         sert a decouvrir le vrai nom de l'executable. A mettre sur false ensuite.
; false = seulement les executables de process_allowlist.
discovery_mode = false

; error | warn | info | debug
log_level = info

[probe]
; Ajoute XR_EXT_hand_tracking aux extensions activees si le jeu ne l'a pas demandee
; et si le runtime la propose. Seule modification que fait l'etape 0.
; Si le runtime refuse, la creation est retentee a l'identique de la demande du jeu.
enable_hand_tracking_extension = true

; A la creation de session : cree puis detruit un suivi des mains (gauche/droite)
; pour prouver que le suivi fonctionne.
probe_hand_tracker = true

; Journalise chaque binding suggere par le jeu (peut etre long).
log_bindings = true

[emulation]
; Le jeu voit un controleur place sur votre main (suivi des mains XR_EXT_hand_tracking) :
; un rayon pour viser, un geste du pouce pour cliquer.
; Necessite que le suivi des mains soit expose (Virtual Desktop : option "forward tracking").
; 'enabled' est lu au lancement du jeu ; TOUS les autres reglages ci-dessous sont relus a chaud.
; false (defaut) = mode "mains seules" + pochoir de zones : pas de rayon, les manettes virtuelles de VDXR sont masquees (voir [hands]).
; true = le jeu recoit un controleur emule sur la main (rayon + clic du pouce), peu precis.
enabled = false

; --- Viser -------------------------------------------------------------------------------
; Origine du rayon :
;   shoulder = comme l'interface du casque : le rayon part d'un point rigide de la main (la ou se rejoignent pouce et index) et sa direction va
;            de l'EPAULE estimee vers ce point. Droite longue et origine fixe : tres stable, rien ne bouge au pincement (defaut)
;   contact = le rayon passe par le POINT DE CONTACT du clic (la ou le pouce touche le doigt) : au clic il est aligne avec
;            l'endroit vise ; direction du poignet vers ce point, origine ramenee vers la paume 
;   palm   = comme l'interface du casque : le rayon part de la PAUME et suit l'axe du doigt choisi dans sa pose
;            naturelle ; la direction est lissee lentement, donc bouger le doigt brievement (clic) ne la deplace pas
;   hand   = rigide a la paume : le rayon suit l'AXE DE LA MAIN (origine a la base du doigt)
;   finger = orientation du bout du doigt
pointer_mode = shoulder
; Mode shoulder : position estimee de l'epaule par rapport a la tete (millimetres) : ecart lateral, hauteur sous la tete, recul.
shoulder_side_mm = 180
shoulder_drop_mm = 170
shoulder_back_mm = 50
; Mode shoulder : d'ou part le rayon. fingertip (defaut) = le bout du doigt du pointeur (pointer_finger) : le rayon part de la pointe
; de la main. bone = point rigide sur l'os (anchor_forward_mm ci-dessous), independant de tout doigt.
; Avec pointer_finger = middle et un clic pouce-index, la pointe du majeur ne bouge pas au clic.
anchor_source = fingertip
; Mode shoulder : quand les doigts pointent ailleurs que le bras (main verticale, bouton sur le cote ou en bas), le rayon bascule
; progressivement vers la direction du doigt : 100 % epaule sous start_deg d'ecart, 100 % doigt au-dela de end_deg.
; Mode shoulder : lissage de la direction (Hz plus petit = plus stable a l arret, 0 = aucun ; beta plus grand = moins de retard).
shoulder_smooth_hz = 0.8
shoulder_smooth_beta = 3
finger_blend = true
finger_blend_start_deg = 30
finger_blend_end_deg = 70
; Mode shoulder : vitesse (secondes) a laquelle le torse estime suit la rotation de la tete. Les epaules restent en place quand vous
; tournez la tete pour regarder un bouton sur le cote. 0 = les epaules suivent la tete instantanement.
torso_follow_s = 3
; Mode shoulder : le rayon part d'un point RIGIDE de la main (base du doigt avancee le long de l'os, en mm) : plier ou pincer
; ne le deplace pas. Augmenter pour le rapprocher du bout des doigts.
anchor_forward_mm = 70
; Mode palm : articulation visee depuis la paume : proximal, intermediate (defaut), distal ou tip.
palm_aim = intermediate
; Mode palm : vitesse de suivi de la direction (Hz). Petit = tres stable mais reagit lentement a un changement de pose.
palm_follow_hz = 0.6

; Doigt qui porte le pointeur (relu a chaud) :
;   index  = le pointeur est sur l'index (defaut)
;   middle = le pointeur est sur le MAJEUR : il bouge moins quand l'index sert au clic.
;            Dans ce cas, mettre click_mode = pinch (le pouce touche le bout de l'index).
pointer_finger = index
; Reglage fin de la direction, en degres, dans le repere de la paume (-45 a 45).
; pitch positif = vers le haut, yaw positif = vers la gauche.
pointer_pitch_deg = 0
pointer_yaw_deg = 0

; --- Cliquer -----------------------------------------------------------------------------
; Geste de clic : le pouce touche
;   side   = le COTE de l'index : l'index ne bouge pas (defaut)
;   pinch  = le BOUT de l'index
;   middle = le bout du majeur
click_mode = any
; Au clic, le pointeur ne doit pas bouger : il se fige des que le pouce s approche (prelatch_mm au-dela du seuil de clic), puis reste
; dans une zone morte (degres, mm) tant que la main bouge peu ; au-dela il suit la main (glisser une molette). 0 = pas de zone morte.
prelatch_mm = 14
freeze_deadzone_deg = 1.5
freeze_deadzone_mm = 10
; Distance pouce-cible (millimetres) : clic sous click_on_mm, relachement au-dessus de click_off_mm.
click_on_mm = 20
click_off_mm = 23
; Le clic accepte les positions ESTIMEES du pouce et de la cible (utile quand le pouce est masque par la main).
; Mettre a true pour n'exiger que des articulations reellement suivies (risque : clics manques pouce cache).
click_require_tracked = false
; Pendant un clic, le pointeur reste ancre a sa position d'AVANT le geste (millisecondes de recul).
latch_ms = 150

; --- Stabilite ---------------------------------------------------------------------------
; Lissage de l'orientation (filtre One Euro). Plus smooth_rot_hz est petit, plus c'est stable a
; l'arret ; plus smooth_rot_beta est grand, moins il y a de retard quand on bouge vite.
smoothing = true
smooth_rot_hz = 1.5
smooth_rot_beta = 0.8
; N'utiliser que les articulations "suivies" (pas seulement "valides"/extrapolees). A mettre sur
; false uniquement si le journal montre que le runtime ne renseigne jamais le bit "suivi".
require_tracked = true

; --- Affichage ---------------------------------------------------------------------------
; EXPERIMENTAL : masque les modeles de manettes du jeu en envoyant tres loin la pose "grip" (la ou le jeu dessine
; le modele). Sans effet si le jeu dessine le modele a la pose du rayon.
hide_controller_model = false

; --- Les deux mains ---------------------------------------------------------------------
; MSFS ne gere qu'un controleur actif a la fois (vous deviez cacher une main pour utiliser l'autre). Avec shared_pointer = true,
; la main ENGAGEE (celle dont le pouce s'approche de la cible du clic, ou qui clique deja) fournit le rayon et le clic aux DEUX
; emplacements du jeu : plus besoin de cacher une main. Relu a chaud.
shared_pointer = false
; Distance pouce-cible (mm) sous laquelle une main peut devenir engagee (au-dessus de click_on_mm).
engage_mm = 34

[hands]
; Squelette de vos mains (articulations + os) dessine par-dessus le jeu (Direct3D 12).
; Le bout du pouce et l'articulation visee par le clic passent au vert pendant un clic.
; 'enabled' et 'render_scale' sont lus au lancement du jeu ; le reste est relu a chaud.
enabled = true
; Resolution de la surimpression par rapport a celle du jeu (0.25 a 1.0). Plus bas = moins de GPU.
render_scale = 0.75
; Taille des articulations (multiplicateur) et epaisseur des os (millimetres).
joint_scale = 0.5
bone_mm = 8
; Mode "mains seules" : Virtual Desktop fabrique lui-meme des manettes Touch a partir de vos mains (MSFS dessine alors des manettes
; fantomes, un rayon, et prend vos pincements pour des clics). Avec hide_controllers = true (et [emulation] enabled = false), la couche cache ces
; manettes tant que la main est suivie ; les vraies manettes reviennent des que les mains ne sont plus suivies. Relu a chaud.
hide_controllers = true
; Delai (ms) sans suivi de la main avant que ses manettes reapparaissent (evite le scintillement).
hide_hold_ms = 1000
; Annonce aussi "aucun profil d'interaction" sur la main masquee (le jeu ne croit plus a une manette connectee).
hide_controllers_profile = true

[touch]
; Contact avec les commandes via la profondeur du jeu (en cours d'etude).
; Sonde en LECTURE SEULE : copie quelques pixels des images de profondeur de MSFS et les journalise avec la distance
; de vos bouts de doigts, pour comprendre l'encodage de la profondeur. N'influence pas le jeu.
; 'depth_probe' est relu a chaud ; mettre false si vous soupconnez qu'elle gene.
depth_probe = true
probe_interval_ms = 500
; Etat dans lequel le jeu laisse ses images de profondeur : depth_write (defaut), depth_read, common, shader, copy_source.
; A changer seulement si le journal montre des erreurs ou des valeurs absurdes.
depth_state = depth_write

; Captures du rendu de MSFS autour de votre main (pour voir ce que le jeu dessine : fleche, rayon, point d'impact).
; Au plus capture_max images par session (0 = aucune), dans C:\ProgramData\HandsLayer\logs\captures, une toutes les
; capture_interval_ms au plus, et une a chaque debut de clic. Ce sont des images du jeu (cockpit), rien d autre.
capture_max = 16
capture_interval_ms = 3000
; Etat des images couleur du jeu : render_target (defaut), common, shader, copy_source.
color_state = render_target

[menu]
; Menu des reglages affiche DANS le casque : pincez les DEUX mains en meme temps pendant open_hold_ms pour l'ouvrir (ou le fermer).
; Pendant qu'il est ouvert, vos clics ne vont plus au jeu. Chaque choix est ecrit dans ce fichier et pris en compte aussitot.
enabled = true
open_hold_ms = 1200

[zones]
; Pochoir : le bout de l'index touche une zone apprise et la commande du simulateur correspondante est envoyee (par HandsBridge.exe, SimConnect).
; Les zones et leurs commandes sont dans data\zones.ini (fenetre "Configurer les zones" de la tray, ou menu en VR).
enabled = true
; Boites en fil de fer des zones (taille selon la commande, couleur selon le type : bleu poussoir/bascule, jaune interrupteur, orange rotatif, vert curseur) :
; all = toutes, near = seulement pres du bout des doigts (near_cm), hidden = cachees. finger_mm : taille du bout du doigt (la boite est agrandie d'autant).
show_boxes = all
; full = boite complete (12 aretes) ; face = seulement la face avant (un carre ou un rectangle, plus discret).
box_faces = full
; Touche de recentrage de MSFS (la meme !) : les zones suivent le cockpit. Apres l'appui, la couche releve la pose de la tete (position et
; direction) et deplace toutes les zones en consequence. LSHIFT (defaut), RSHIFT, LCTRL, F1..F24, A..Z, 0..9, ou un code 0xNN. Vide = aucune.
; A faire : s'asseoir en position neutre, recentrer la vue dans MSFS (cette touche), PUIS apprendre ou utiliser les zones.
recenter_key = LSHIFT
recenter_delay_ms = 600
near_cm = 30
finger_mm = 6
radius_mm = 20
dwell_ms = 250
rearm_ms = 400
; Delai (ms) entre l'appui sur le bouton de memorisation et l'enregistrement de la zone : le temps de poser le bout de l'index.
teach_delay_ms = 1500
; Boutons de joystick / HOTAS (numerotation de joy.cpl) qui memorisent la zone / effacent les positions. Se choisissent depuis le menu de la tray
; (Zones > Choisir le bouton...). joystick : morceau du nom du peripherique ("" = n'importe lequel). 0 = aucun.
joystick =
teach_button = 0
clear_button = 0
