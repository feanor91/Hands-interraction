; hands.ini — configuration de la couche XR_APILAYER_HANDS_bare
; Ce fichier est relu automatiquement (environ 1 seconde apres chaque enregistrement).
; Exception : la section [general] process_allowlist / discovery_mode n'est lue
; qu'au demarrage du jeu.
; Commentaires : lignes commencant par ; ou #

[general]
; Interrupteur general (bascule depuis l'icone de la barre des taches). false = la couche
; laisse tout passer ; effectif au prochain lancement du jeu.
enabled = true

; Executables pour lesquels la couche s'active. ATTENTION : valeur NON VERIFIEE.
; Verifiez le nom exact avec scripts\check-process.ps1 pendant que MSFS tourne.
process_allowlist = FlightSimulator2024.exe

; true  = la couche s'active (journalisation seule) pour TOUT programme OpenXR :
;         sert a decouvrir le vrai nom de l'executable. A mettre sur false ensuite.
; false = seulement les executables de process_allowlist.
discovery_mode = true

; error | warn | info | debug
log_level = info

[probe]
; Ajoute XR_EXT_hand_tracking aux extensions activees si le jeu ne l'a pas demandee
; et si le runtime la propose. Seule modification que fait l'etape 0.
; Si le runtime refuse, la creation est retentee a l'identique de la demande du jeu.
enable_hand_tracking_extension = true

; A la creation de session : cree puis detruit un suivi des mains (gauche/droite)
; pour prouver que le suivi fonctionne.
probe_hand_tracker = true

; Journalise chaque binding suggere par le jeu (peut etre long).
log_bindings = true

[emulation]
; Le jeu voit un controleur place sur votre main (suivi des mains XR_EXT_hand_tracking) :
; un rayon pour viser, un geste du pouce pour cliquer.
; Necessite que le suivi des mains soit expose (Virtual Desktop : option "forward tracking").
; 'enabled' est lu au lancement du jeu ; TOUS les autres reglages ci-dessous sont relus a chaud.
enabled = true

; --- Viser -------------------------------------------------------------------------------
; Origine du rayon :
;   hand   = AXE DE LA MAIN (paume) : plier ou bouger les doigts ne deplace pas le rayon (defaut)
;   finger = orientation du bout de l'index
pointer_mode = hand
; Reglage fin de la direction, en degres, dans le repere de la paume (-45 a 45).
; pitch positif = vers le haut, yaw positif = vers la gauche.
pointer_pitch_deg = 0
pointer_yaw_deg = 0

; --- Cliquer -----------------------------------------------------------------------------
; Geste de clic : le pouce touche
;   side   = le COTE de l'index : l'index ne bouge pas (defaut)
;   pinch  = le BOUT de l'index
;   middle = le bout du majeur
click_mode = side
; Distance pouce-cible (millimetres) : clic sous click_on_mm, relachement au-dessus de click_off_mm.
click_on_mm = 22
click_off_mm = 35
; Pendant un clic, le pointeur reste ancre a sa position d'AVANT le geste (millisecondes de recul).
latch_ms = 150

; --- Stabilite ---------------------------------------------------------------------------
; Lissage de l'orientation (filtre One Euro). Plus smooth_rot_hz est petit, plus c'est stable a
; l'arret ; plus smooth_rot_beta est grand, moins il y a de retard quand on bouge vite.
smoothing = true
smooth_rot_hz = 1.5
smooth_rot_beta = 0.8
; N'utiliser que les articulations "suivies" (pas seulement "valides"/extrapolees). A mettre sur
; false uniquement si le journal montre que le runtime ne renseigne jamais le bit "suivi".
require_tracked = true

; --- Affichage ---------------------------------------------------------------------------
; EXPERIMENTAL : masque les modeles de manettes du jeu. Si le jeu cesse de reagir, remettre a false.
hide_controller_model = false

[hands]
; Squelette de vos mains (articulations + os) dessine par-dessus le jeu (Direct3D 12).
; Le bout du pouce et l'articulation visee par le clic passent au vert pendant un clic.
; 'enabled' et 'render_scale' sont lus au lancement du jeu ; le reste est relu a chaud.
enabled = true
; Resolution de la surimpression par rapport a celle du jeu (0.25 a 1.0). Plus bas = moins de GPU.
render_scale = 0.75
; Taille des articulations (multiplicateur) et epaisseur des os (millimetres).
joint_scale = 0.5
bone_mm = 8
