; hands.ini — configuration de la couche XR_APILAYER_HANDS_bare
; Ce fichier est relu automatiquement (environ 1 seconde apres chaque enregistrement).
; Exception : la section [general] process_allowlist / discovery_mode n'est lue
; qu'au demarrage du jeu.
; Commentaires : lignes commencant par ; ou #

[general]
; Interrupteur general (bascule depuis l'icone de la barre des taches). false = la couche
; laisse tout passer ; effectif au prochain lancement du jeu.
enabled = true

; Executables pour lesquels la couche s'active. ATTENTION : valeur NON VERIFIEE.
; Verifiez le nom exact avec scripts\check-process.ps1 pendant que MSFS tourne.
process_allowlist = FlightSimulator2024.exe

; true  = la couche s'active (journalisation seule) pour TOUT programme OpenXR :
;         sert a decouvrir le vrai nom de l'executable. A mettre sur false ensuite.
; false = seulement les executables de process_allowlist.
discovery_mode = true

; error | warn | info | debug
log_level = info

[probe]
; Ajoute XR_EXT_hand_tracking aux extensions activees si le jeu ne l'a pas demandee
; et si le runtime la propose. Seule modification que fait l'etape 0.
; Si le runtime refuse, la creation est retentee a l'identique de la demande du jeu.
enable_hand_tracking_extension = true

; A la creation de session : cree puis detruit un suivi des mains (gauche/droite)
; pour prouver que le suivi fonctionne.
probe_hand_tracker = true

; Journalise chaque binding suggere par le jeu (peut etre long).
log_bindings = true

[emulation]
; Etape 1 : le jeu voit un controleur place au bout de votre index (suivi des mains
; XR_EXT_hand_tracking). La gachette = pincement pouce-index.
; Necessite que le suivi des mains soit expose (Virtual Desktop : option "forward tracking").
; Effectif au prochain lancement du jeu pour 'enabled' ; les autres valeurs sont relues a chaud.
enabled = true

; true  = la pose "grip" suit aussi le bout de l'index (le modele de manette du jeu suit le doigt).
; false = seule la pose "aim" (le rayon/pointeur) est remplacee.
override_grip = true

; Distance pouce-index (millimetres) : appui sous pinch_on_mm, relachement au-dessus de pinch_off_mm.
pinch_on_mm = 22
pinch_off_mm = 35

; Pendant un pincement, le pointeur reste ancre a sa position d'AVANT le pincement (le bout de
; l'index descend quand on pince, ce qui ferait rater la cible). Valeur = recul en millisecondes.
latch_ms = 150

; Lissage de l'orientation du pointeur (filtre One Euro). Plus smooth_rot_hz est petit, plus c'est
; stable a l'arret ; plus smooth_rot_beta est grand, moins il y a de retard quand on bouge vite.
smoothing = true
smooth_rot_hz = 1.5
smooth_rot_beta = 0.8

; N'utiliser que les articulations "suivies" (pas seulement "valides"/extrapolees). A mettre sur
; false uniquement si le journal montre que le runtime ne renseigne jamais le bit "suivi".
require_tracked = true
